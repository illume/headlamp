config:
  settings:
    defaults:
      plugins:
        example-plugin:
          retries: 5
          endpoint:
            $value: https://example.com
            $display: disabled
pluginsManager:
  enabled: true
  config:
    plugins:
    - name: example-plugin
      source: https://artifacthub.io/packages/headlamp/example/example-plugin
      settings:
        endpoint: https://manager.example.com
        retries: 3
    - name: second-plugin
      source: https://artifacthub.io/packages/headlamp/example/second-plugin
      settings:
        enabled: true
