{{- $adminSettings := include "headlamp.adminSettings" . | fromJson }}
{{- with $adminSettings }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "headlamp.adminSettingsName" $ }}
  namespace: {{ include "headlamp.namespace" $ }}
  labels:
    {{- include "headlamp.labels" $ | nindent 4 }}
data:
  settings.json: {{ toJson . | quote }}
{{- end }}
